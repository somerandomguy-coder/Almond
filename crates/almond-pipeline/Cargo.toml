[package]
name = "almond-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Processor registry, artifact DAG planner, replicated job runner and external (JSON-RPC) processor host"

[dependencies]
almond-types = { path = "../almond-types" }
async-trait = "0.1.92"
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync", "process", "io-util"] }

[dev-dependencies]
almond-types = { path = "../almond-types", features = ["mock"] }
almond-llm = { path = "../almond-llm" }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "process", "io-util", "net"] }
