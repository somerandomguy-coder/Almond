[package]
name = "almond-verify"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Claim extraction, verifiers and verdict aggregation for Almond (WS-H)"

[features]
default = ["datalog"]
# Cross-claim consistency rules evaluated with the `ascent` Datalog engine (verify.consistency).
datalog = ["dep:ascent"]

[dependencies]
almond-types = { path = "../almond-types" }
ascent = { version = "0.8.1", optional = true }
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
unicode-normalization = "0.1"

[dev-dependencies]
almond-types = { path = "../almond-types", features = ["mock"] }
futures = "0.3.34"
reqwest ={ version = "0.13.5", default-features = false, features = ["json"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
