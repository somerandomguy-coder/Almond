[package]
name = "almond-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LLM providers (Ollama), prompt templates (vi/en) and LLM processors for Almond"

[dependencies]
almond-types = { path = "../almond-types" }
async-trait = "0.1.92"
blake3 = "1.8.7"
futures = "0.3.34"
# Ollama is only ever reached over plain HTTP on localhost -> no TLS stack needed.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync"] }

[dev-dependencies]
almond-types = { path = "../almond-types", features = ["mock"] }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
