[package]
name = "almond-types"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
mock = ["dep:tokio"]

[dependencies]
async-trait = "0.1.92"
futures = "0.3.34"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync"], optional = true }
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
ulid = "3.0.0"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time"] }
