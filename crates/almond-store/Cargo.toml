[package]
name = "almond-store"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Almond local store: SQLite event log, materialized views, FTS, blobs, Loro notes"

[dependencies]
almond-types = { path = "../almond-types" }
base64 = "0.22"
blake3 = "1.8.7"
loro = "=1.17.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = "3.27.0"

[dev-dependencies]
almond-types = { path = "../almond-types", features = ["mock"] }
