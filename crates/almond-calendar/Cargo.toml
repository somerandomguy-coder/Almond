[package]
name = "almond-calendar"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
almond-types = { path = "../almond-types" }
async-trait = "0.1.92"
base64 = "0.23.1"
blake3 = { version = "1.8.7", default-features = false, features = ["std", "pure"] }
chrono = "0.4.45"
chrono-tz = "0.10.4"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query", "form"] }
rrule = "0.14.0"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["net", "sync", "time", "rt", "macros", "io-util"] }
url = "2.5.8"

[dev-dependencies]
almond-types = { path = "../almond-types", features = ["mock"] }
tokio = { version = "1.54.1", features = ["full"] }
wiremock = "0.6.5"
