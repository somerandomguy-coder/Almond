name: CI
on:
  push:
    branches: [main, "ws/**"]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux deps (Tauri, audio)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libpipewire-0.3-dev libclang-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build UI (needed by Tauri crate)
        run: pnpm -C apps/desktop install --frozen-lockfile && pnpm -C apps/desktop build
      - run: cargo fmt --all -- --check
      # almond-stt's GPU features (cuda/vulkan) need toolkits the runners don't have, and its
      # whisper/sherpa engines are native builds tested on dev machines; CI checks its default build.
      - run: cargo clippy --workspace --all-targets --all-features --exclude almond-stt -- -D warnings
      - run: cargo clippy -p almond-stt --all-targets -- -D warnings
      - run: cargo test --workspace --all-features --exclude almond-stt
      - run: cargo test -p almond-stt
