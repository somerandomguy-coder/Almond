[package]
name = "almond-desktop"
version = "0.1.0"
description = "Almond desktop + Android app"
authors = ["Almond contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "almond_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset: `audio.url` returns asset-protocol URLs for recorded audio (tauri.conf.json scope).
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
almond-types = { path = "../../../crates/almond-types" }
almond-core = { path = "../../../crates/almond-core" }
tokio = { version = "1.54.1", features = ["sync"] }

[features]
default = []
# Native speech engines; build the app with `--features whisper,sherpa` (or `cuda`) for real transcription.
whisper = ["almond-core/whisper"]
sherpa = ["almond-core/sherpa"]
cuda = ["almond-core/cuda"]
